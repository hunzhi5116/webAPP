<body>

<div id="manual-control">
    <div style="font-weight:bold; color:#00d2ff; margin-bottom:10px;">🛠️ 發射基地與位置微調</div>
    
    <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
        <button id="btn-usa" class="btn-base">🇺🇸 美國佛州 (事實)</button>
        <button id="btn-tw" class="btn-base active">🇹🇼 台灣旭海 (創意)</button>
    </div>
    
    <div class="slider-group">
        <label>左右位置 (X 軸) <span id="valX" class="value-span">-0.55</span></label>
        <input type="range" id="slipX" min="-8" max="8" step="0.05" value="-2.20" disabled="">
    </div>
    
    <div class="slider-group">
        <label>上下位置 (Y 軸) <span id="valY" class="value-span">3.50</span></label>
        <input type="range" id="slipY" min="-8" max="8" step="0.05" value="3.75" disabled="">
    </div>
    
    <div class="slider-group">
        <label>前後位置 (Z 軸) <span id="valZ" class="value-span">-8.00</span></label>
        <input type="range" id="slipZ" min="-8.5" max="8.5" step="0.05" value="7.25" disabled="">
    </div>
    <div style="font-size:11px; color:#888;">提示：點擊上方基地按鈕，可以讓飛上天的火箭「瞬間落地」還原回發射台喔！</div>
</div>

<div id="launch-control">
    <div id="stage-display" style="background: rgba(0, 255, 0, 0.2); border-left-color: rgb(0, 255, 170);">🏁 狀態：已進入初步軌道高度</div>
    <button id="btn-launch" class="active">🚀 發射完成。</button>
</div>

<script src="./moon_files/three.min.js.下載"></script>
<script src="./moon_files/OrbitControls.js.下載"></script>

<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    camera.position.set(2, 4, 12); 
    controls.target.set(0, 0, 0); 
    controls.update();

    scene.add(new THREE.AmbientLight(0x666666));
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
    sunLight.position.set(30, 25, 20);
    scene.add(sunLight);

    const textureLoader = new THREE.TextureLoader();
    const earthRadius = 8; 
    const earthGeometry = new THREE.SphereGeometry(earthRadius, 64, 64);
    const earthMaterial = new THREE.MeshPhongMaterial({
        map: textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg'),
        bumpMap: textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg'),
        bumpScale: 0.05,
        specularMap: textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg'),
        specular: new THREE.Color('grey')
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    earth.rotation.y = -0.45; 
    scene.add(earth);

    const shipGroup = new THREE.Group();
    const shipMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.8, 16), shipMat);
    shipGroup.add(body);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.4, 16), shipMat);
    cone.position.y = 0.6; 
    shipGroup.add(cone);
    scene.add(shipGroup);

    const fireGeom = new THREE.ConeGeometry(0.12, 0.8, 16);
    const fireMat = new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.9 });
    const fire = new THREE.Mesh(fireGeom, fireMat);
    fire.position.y = -0.8; 
    fire.rotation.x = Math.PI; 
    fire.visible = false; 
    shipGroup.add(fire);

    const slipX = document.getElementById('slipX');
    const slipY = document.getElementById('slipY');
    const slipZ = document.getElementById('slipZ');
    const valX = document.getElementById('valX');
    const valY = document.getElementById('valY');
    const valZ = document.getElementById('valZ');

    let currentGroundPos = new THREE.Vector3(); 

    function updateShipPosition() {
        if (missionStage === "PENDING") {
            const x = parseFloat(slipX.value);
            const y = parseFloat(slipY.value);
            const z = parseFloat(slipZ.value);
            
            valX.innerText = x.toFixed(2);
            valY.innerText = y.toFixed(2);
            valZ.innerText = z.toFixed(2);
            
            currentGroundPos.set(x, y, z);
            shipGroup.position.set(x, y, z);
            
            const normal = new THREE.Vector3(x, y, z).normalize();
            const upVector = new THREE.Vector3(0, 1, 0);
            shipGroup.quaternion.setFromUnitVectors(upVector, normal);
        }
    }

    slipX.addEventListener('input', updateShipPosition);
    slipY.addEventListener('input', updateShipPosition);
    slipZ.addEventListener('input', updateShipPosition);

    const usaCoords = { x: -2.20, y: 3.75, z: 7.25 };  
    const twCoords = { x: -0.55, y: 3.50, z: -8.00 };  

    const btnLaunch = document.getElementById('btn-launch');
    const stageDisplay = document.getElementById('stage-display');

    // 🔥 核心修正：將「重置/還原發射台」寫成一個函數
    function resetToPad(coords, cameraPos, lightPos) {
        // 1. 重置動畫變數
        missionStage = "PENDING";
        liftAltitude = 0;
        fire.visible = false;

        // 2. 恢復按鈕與狀態文字
        btnLaunch.innerText = "🚀 點火升空";
        btnLaunch.classList.remove('active');
        stageDisplay.innerText = "🔴 狀態：待命 (T-0)";
        stageDisplay.style.background = "rgba(255,165,0,0.3)";
        stageDisplay.style.borderLeftColor = "#ffa500";

        // 3. 解鎖滑動條
        slipX.disabled = false;
        slipY.disabled = false;
        slipZ.disabled = false;

        // 4. 設定新位置並更新
        slipX.value = coords.x;
        slipY.value = coords.y;
        slipZ.value = coords.z;
        updateShipPosition();
        
        // 5. 轉移鏡頭
        camera.position.set(cameraPos.x, cameraPos.y, cameraPos.z);
        sunLight.position.set(lightPos.x, lightPos.y, lightPos.z);
        controls.target.set(coords.x, coords.y * 0.8, coords.z);
        controls.update();
    }

    document.getElementById('btn-usa').addEventListener('click', (e) => {
        document.querySelectorAll('.btn-base').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        // 無論剛剛是在天上還是哪裡，一鍵點擊立刻落地還原到佛州！
        resetToPad(usaCoords, {x: 2, y: 4, z: 12}, {x: 30, y: 25, z: 20});
    });

    document.getElementById('btn-tw').addEventListener('click', (e) => {
        document.querySelectorAll('.btn-base').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        // 無論剛剛是在天上還是哪裡，一鍵點擊立刻落地還原到台灣！
        resetToPad(twCoords, {x: -1, y: 5, z: -12}, {x: -30, y: 25, z: -20});
    });

    let missionStage = "PENDING"; 
    let liftAltitude = 0; 
    const maxLiftAltitude = 5; 

    btnLaunch.addEventListener('click', () => {
        if (missionStage === "PENDING") {
            missionStage = "LAUNCHING";
            btnLaunch.innerText = "🚀 正在垂直上升中...";
            btnLaunch.classList.add('active');
            stageDisplay.innerText = "🔥 狀態：點火升空！";
            stageDisplay.style.background = "rgba(0,255,0,0.2)";
            stageDisplay.style.borderLeftColor = "#00ffaa";
            fire.visible = true; 

            slipX.disabled = true;
            slipY.disabled = true;
            slipZ.disabled = true;
        }
    });

    updateShipPosition();

    function animate() {
        requestAnimationFrame(animate);

        if (missionStage === "LAUNCHING") {
            liftAltitude += 0.02; 

            const liftNormal = currentGroundPos.clone().normalize();
            const newPos = currentGroundPos.clone().add(liftNormal.multiplyScalar(liftAltitude));
            shipGroup.position.copy(newPos);

            stageDisplay.innerText = `🌔 上升高度：${(liftAltitude * 1000).toFixed(0)} 公里`;

            if (liftAltitude >= maxLiftAltitude) {
                missionStage = "FINISHED";
                fire.visible = false; 
                stageDisplay.innerText = "🏁 狀態：已進入初步軌道高度";
                btnLaunch.innerText = "🚀 發射完成。";
            }
        }

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script><canvas width="1026" height="911" style="display: block; width: 1026px; height: 911px;"></canvas><canvas width="1920" height="945" style="display: block; width: 1920px; height: 945px;"></canvas>
