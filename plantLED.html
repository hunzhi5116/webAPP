<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧植物燈 V10.4 監控面板</title>
    <style>
        :root {
            --primary: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --purple: #9b59b6;
            --dark: #34495e;
        }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #ecf0f1; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: var(--dark); margin-bottom: 25px; font-size: 24px; }
        
        .status-box { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; border-left: 5px solid #bdc3c7; }
        .status-box.connected { border-left-color: var(--success); }
        
        button { width: 100%; padding: 16px; margin: 8px 0; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; color: white; }
        button:active { transform: scale(0.98); opacity: 0.9; }
        
        .btn-connect { background-color: var(--dark); margin-bottom: 20px; }
        .btn-auto { background-color: var(--primary); }
        .btn-on { background-color: var(--success); }
        .btn-off { background-color: var(--danger); }
        .btn-supp { background-color: var(--purple); margin-top: 15px; box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3); }
        
        .info-text { font-size: 14px; color: #7f8c8d; margin-top: 5px; }
        .last-cmd { font-weight: bold; color: var(--purple); }
    </style>
</head>
<body>
    <div class="container">
        <h2>植物燈系統控制</h2>
        
        <div class="status-box" id="statusBox">
            <div id="connStat">狀態：等待連接...</div>
            <div class="info-text">最後發送：<span id="lastCmdText" class="last-cmd">無</span></div>
        </div>

        <button class="btn-connect" onclick="connectBLE()">1. 連接 ESP32 裝置</button>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        
        <button class="btn-auto" onclick="sendBLE('AUTO')">切換：自動感應模式</button>
        <button class="btn-on" onclick="sendBLE('ON')">手動：強制開啟 LED</button>
        <button class="btn-off" onclick="sendBLE('OFF')">手動：強制關閉 LED</button>
        
        <button class="btn-supp" onclick="sendBLE('SUPP')">啟動：智慧累積補光模式</button>
        <p class="info-text">※ 補光模式將執行「1分紀錄 + 1分補光」循環</p>
    </div>

    <script>
        let device, characteristic;
        // 必須與 ESP32 程式碼中的 UUID 完全一致
        const SERVICE_UUID        = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        async function connectBLE() {
            try {
                document.getElementById('connStat').innerText = "狀態：掃描中...";
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'ESP32' }],
                    optionalServices: [SERVICE_UUID]
                });
                
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                document.getElementById('connStat').innerText = "狀態：連線成功";
                document.getElementById('statusBox').classList.add('connected');
                
                // 監聽斷開事件
                device.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('connStat').innerText = "狀態：連線已中斷";
                    document.getElementById('statusBox').classList.remove('connected');
                });
            } catch (error) {
                console.error(error);
                document.getElementById('connStat').innerText = "狀態：連線失敗";
            }
        }

        async function sendBLE(cmd) {
            if (!characteristic) {
                alert("請先點擊上方按鈕連接 ESP32 裝置！");
                return;
            }

            try {
                // 確保指令轉換為 Uint8Array
                let encoder = new TextEncoder();
                let data = encoder.encode(cmd);
                await characteristic.writeValue(data);
                
                // 更新網頁上的最後指令顯示
                document.getElementById('lastCmdText').innerText = cmd;
                console.log("已發送指令: " + cmd);
            } catch (error) {
                console.error("發送失敗:", error);
                document.getElementById('connStat').innerText = "狀態：發送指令失敗";
            }
        }
    </script>
</body>
</html>
